<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Chen · Portfolio</title>
<style>
  :root {
    --bg: #0a0a0f;
    --primary: #6366f1;
    --primary-end: #8b5cf6;
    --text: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: rgba(255,255,255,0.06);
    --border-accent: rgba(99,102,241,0.3);
    --accent: #818cf8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* 背景网格 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* 中心光晕 */
  body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(800px, 100vw);
    height: 400px;
    background: radial-gradient(ellipse, rgba(99,102,241,0.12), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* 渐变文字工具类 */
  .gradient-text {
    background: linear-gradient(135deg, var(--primary), var(--primary-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* 胶囊标签工具类 */
  .tag {
    display: inline-block;
    background: rgba(99,102,241,0.1);
    border: 1px solid var(--border-accent);
    color: var(--accent);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 2px;
  }

  /* 光标闪烁 */
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .cursor {
    color: var(--primary);
    animation: blink 1s step-end infinite;
  }

  /* 所有内容层级高于背景 */
  nav, main, footer { position: relative; z-index: 1; }

  /* ── 导航栏 ── */
  #navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    border-bottom: 1px solid var(--border);
    transition: background 0.3s, backdrop-filter 0.3s;
    z-index: 100;
  }

  #navbar.scrolled {
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--primary), var(--primary-end));
    border-radius: 7px;
    flex-shrink: 0;
  }

  .nav-logo-name {
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--text); }

  .nav-lang {
    background: rgba(99,102,241,0.12);
    border: 1px solid var(--border-accent);
    color: var(--accent);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
  }

  /* ── Hero ── */
  #hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 24px 60px;
  }

  .hero-badge {
    margin-bottom: 24px;
  }

  .hero-title {
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -1px;
    margin-bottom: 14px;
  }

  .hero-subtitle {
    color: var(--text-secondary);
    font-size: clamp(14px, 2vw, 18px);
    margin-bottom: 10px;
  }

  .hero-desc {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 480px;
    margin: 0 auto 32px;
    line-height: 1.7;
  }

  .hero-cta {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 56px;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-end));
    color: #fff;
    border: none;
    padding: 11px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  }

  .btn-secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 11px 28px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }

  .btn-secondary:hover {
    border-color: var(--border-accent);
    color: var(--text);
  }

  .hero-stats {
    display: flex;
    gap: 40px;
    align-items: center;
  }

  .stat {
    text-align: center;
  }

  .stat-number {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 1px;
  }

  .stat-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
  }
</style>
</head>
<body>
  <nav id="navbar">
    <a class="nav-logo" href="#">
      <div class="nav-logo-icon"></div>
      <span class="nav-logo-name">Alex Chen</span>
    </a>
    <ul class="nav-links">
      <li><a href="#about">关于</a></li>
      <li><a href="#about">技能</a></li>
      <li><a href="#faq">FAQ</a></li>
      <li><a href="#footer">联系</a></li>
      <li><span class="nav-lang">EN</span></li>
    </ul>
  </nav>
  <main>
    <section id="hero">
      <div class="hero-badge">
        <span class="tag">PORTFOLIO · 2026</span>
      </div>
      <h1 class="hero-title">
        Hi, I'm <span class="gradient-text" id="typed-name">Alex Chen</span><span class="cursor">_</span>
      </h1>
      <p class="hero-subtitle" id="typed-role">设计师 · 开发者 · 创造者</p>
      <p class="hero-desc">用代码和设计构建有温度的数字体验，专注于 UI/UX 与前端开发。</p>
      <div class="hero-cta">
        <a href="#footer" class="btn-primary">联系我 →</a>
        <a href="#" class="btn-secondary">查看简历</a>
      </div>
      <div class="hero-stats">
        <div class="stat">
          <div class="stat-number gradient-text">3+</div>
          <div class="stat-label">年经验</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <div class="stat-number gradient-text">20+</div>
          <div class="stat-label">完成项目</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <div class="stat-number gradient-text">∞</div>
          <div class="stat-label">创造热情</div>
        </div>
      </div>
    </section>
    <section id="about"></section>
    <section id="faq"></section>
  </main>
  <footer id="footer"></footer>
  <script>
    // 导航毛玻璃
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 60);
    });

    // 打字机动效
    const roles = ['设计师', '开发者', '创造者', 'Designer', 'Developer'];
    let roleIndex = 0;
    let charIndex = 0;
    let deleting = false;
    const roleEl = document.getElementById('typed-role');

    function typeRole() {
      const current = roles[roleIndex];
      if (!deleting) {
        roleEl.textContent = current.slice(0, charIndex + 1);
        charIndex++;
        if (charIndex === current.length) {
          deleting = true;
          setTimeout(typeRole, 1800);
          return;
        }
      } else {
        roleEl.textContent = current.slice(0, charIndex - 1);
        charIndex--;
        if (charIndex === 0) {
          deleting = false;
          roleIndex = (roleIndex + 1) % roles.length;
        }
      }
      setTimeout(typeRole, deleting ? 60 : 100);
    }

    setTimeout(typeRole, 1000);
  </script>
</body>
</html>
